# ============================================================
# JoyShockMapper GUI 官网 — 纯静态 SPA 托管配置
# 来源: template/nginx-spa-static.conf
# ============================================================

server {
    listen 80;
    server_name jsm.wangshun.work;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存 (文件名含 hash 时可安全设置 1 年)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
