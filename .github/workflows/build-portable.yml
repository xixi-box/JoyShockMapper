name: Build portable Windows app

on:
  push:
    branches: [gui-rework]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/tauri-app/package-lock.json

      - name: Build single-file application
        shell: pwsh
        run: .\rust\build-portable.ps1

      - name: Run Rust and embedded-core tests
        shell: pwsh
        working-directory: rust/tauri-app/src-tauri
        run: cargo test --all-targets -- --test-threads=1

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: JoyShockMapper-Windows-x64-${{ github.sha }}
          path: out/portable/JoyShockMapper.exe
          if-no-files-found: error
          retention-days: 14
