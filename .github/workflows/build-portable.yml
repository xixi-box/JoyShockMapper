name: Build portable Windows app

on:
  push:
    tags: ["v*-gui.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/tauri-app/package-lock.json

      - name: Build single-file application
        shell: pwsh
        run: .\rust\build-portable.ps1

      - name: Run Rust and embedded-core tests
        shell: pwsh
        working-directory: rust/tauri-app/src-tauri
        run: cargo test --all-targets -- --test-threads=1

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/portable/JoyShockMapper.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  JoyShockMapper.exe" | Set-Content out/portable/JoyShockMapper.exe.sha256 -Encoding ascii

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: JoyShockMapper-Windows-x64-${{ github.sha }}
          path: out/portable/JoyShockMapper.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JoyShockMapper GUI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/portable/JoyShockMapper.exe
            out/portable/JoyShockMapper.exe.sha256
