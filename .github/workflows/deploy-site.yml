# ============================================================
# JoyShockMapper GUI 官网部署
# 来源: template/deploy-template.yml + interview/.github/workflows/deploy.yml
#
# 触发方式:
#   - push 到 master / main / gui-rework 且改动 site/ 目录 -> 构建并部署官网
#   - workflow_dispatch 手动触发
#
# 前置条件 (GitHub Actions 配置):
#   Variables: ALIYUN_ACR_REGISTRY, ALIYUN_ACR_USERNAME
#   Secrets:   ALIYUN_ACR_PASSWORD
#   可选:      JSM_IMAGE_NAME  默认 wangshun_build/joy-shock-mapper
#   Self-hosted Runner: 需带有 aliyun 标签的 runner (阿里云 ECS)
#
# 部署说明:
#   官网容器监听宿主机 127.0.0.1:8081。需在网关 (wangshun-portfolio) 中
#   配置 jsm.wangshun.work 路由 -> host.docker.internal:8081，
#   并在 DNS 中将 jsm.wangshun.work 解析到阿里云 ECS。
# ============================================================

name: Deploy JoyShockMapper Site

on:
  push:
    branches: [master, main, gui-rework]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ format('{0}/{1}', github.repository_owner, lower(github.event.repository.name)) }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_IMAGE_NAME: ${{ vars.JSM_IMAGE_NAME || 'wangshun_build/joy-shock-mapper' }}
  SITE_PORT: 8081

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: site
          file: site/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-site:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-site:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Aliyun ECS
    needs: build
    runs-on: [self-hosted, aliyun]
    environment: aliyun
    concurrency:
      group: deploy-joy-shock-mapper-site
      cancel-in-progress: false
    steps:
      - name: Deploy site container
        shell: bash
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          GHCR_IMAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          ALIYUN_ACR_REGISTRY: ${{ env.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ env.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          ALIYUN_ACR_IMAGE_NAME: ${{ env.ALIYUN_ACR_IMAGE_NAME }}
          SITE_PORT: ${{ env.SITE_PORT }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ALIYUN_ACR_REGISTRY" ]] || missing+=(ALIYUN_ACR_REGISTRY)
          [[ -n "$ALIYUN_ACR_USERNAME" ]] || missing+=(ALIYUN_ACR_USERNAME)
          [[ -n "$ALIYUN_ACR_PASSWORD" ]] || missing+=(ALIYUN_ACR_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "$ALIYUN_ACR_PASSWORD" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_SITE_IMAGE="$GHCR_REGISTRY/$GHCR_IMAGE_NAME-site"
          ACR_SITE_IMAGE="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"

          if docker pull "$GHCR_SITE_IMAGE:$GITHUB_SHA"; then
            SITE_IMAGE="$GHCR_SITE_IMAGE:$GITHUB_SHA"
          elif docker pull "$ACR_SITE_IMAGE:$GITHUB_SHA"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            SITE_IMAGE="$ACR_SITE_IMAGE:$GITHUB_SHA"
          else
            echo "Unable to pull image $GITHUB_SHA from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          docker rm -f joy-shock-mapper-site 2>/dev/null || true
          docker run -d \
            --name joy-shock-mapper-site \
            --restart unless-stopped \
            -p "127.0.0.1:${SITE_PORT}:80" \
            "$SITE_IMAGE"

          sleep 2
          curl -fsS -o /dev/null --retry 10 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:${SITE_PORT}/"

          docker image prune -f --filter "until=72h" || true
          echo "Site deployed: $SITE_IMAGE on 127.0.0.1:${SITE_PORT}"
